expr 'builtins.currentSystem')\nnix build \"github:logos-co/logos-test-modules#modules.$SYSTEM.test_basic_module.lgx\" -o module-lgx\n```\n\nThe `.lgx` package is now under `./module-lgx/`:\n\n```bash\nls module-lgx/*.lgx\n```"}, {"execs": [{"cmd": "mkdir -p modules\ncp -RL ./logos/modules/. ./modules/\n", "exit_code": 1, "kind": "run", "note": "exit code 1", "output": "cp: cannot stat './logos/modules/.': No such file or directory\n", "status": "fail"}], "md": "### 3.2 Seed the modules directory with the bundled capability module\n\nModules are loaded through the host's capability layer, so the modules\ndirectory also needs the `capability_module` that ships with\n`logoscore`. Copy it across first.\n\n```bash\nmkdir -p modules\ncp -RL ./logos/modules/. ./modules/\n\n```"}, {"execs": [{"cmd": "./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file module-lgx/*.lgx", "exit_code": 0, "kind": "run", "note": "", "output": "Installing from file: module-lgx/logos-test_basic_module-module-lib.lgx... done\nInstalled to: ./modules\n", "status": "pass"}], "md": "### 3.3 Install the .lgx with lgpm\n\nInstall the freshly-built package into `./modules`. `test_basic_module`\nis a `core` module, so it goes to `--modules-dir`. The package is\nunsigned (a local dev build), so we pass `--allow-unsigned`.\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file module-lgx/*.lgx\n```"}, {"execs": [{"cmd": "./lgpm/bin/lgpm --modules-dir ./modules list", "exit_code": 0, "kind": "run", "note": "", "output": "Found 1 installed module(s):\n\nNAME                           VERSION         TYPE       CATEGORY       \n----------------------------------------------------------------------\ntest_basic_module              1.0.0           core       testing        \n", "status": "pass"}], "md": "### 3.4 Confirm the install\n\nScan the directory and confirm the module landed:\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules list\n```"}, {"execs": [], "md": "## Step 4: Run the daemon and call the module\n\nStart `logoscore` in daemon mode pointed at `./modules`, then use the client\nsubcommands to load `test_basic_module`, introspect it, and call two of its\nmethods. Daemon output is captured in `logs.txt`."}, {"execs": [{"cmd": "sh -c './logos/bin/logoscore -D -m ./modules > logs.txt 2>&1 &'", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 4.1 Start the daemon\n\nStart logoscore in daemon mode in the background, capturing output to\n`logs.txt`:\n\n```bash\nlogoscore -D -m ./modules > logs.txt &\n```\n\nThe `-D` flag starts the daemon. The client subcommands below connect to\nthis running process via the config written under `~/.logoscore/`."}, {"execs": [{"cmd": "sleep 3", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 3\n```"}, {"execs": [{"cmd": "cat logs.txt", "exit_code": 0, "kind": "run", "note": "", "output": "sh: 1: ./logos/bin/logoscore: not found\n", "status": "pass"}], "md": "### 4.2 Inspect the startup log\n\nReview the daemon's startup output:\n\n```bash\ncat logs.txt\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore status", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 4.3 Check daemon status\n\nVerify the daemon is running:\n\n```bash\nlogoscore status\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore list-modules", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 4.4 List discovered modules\n\n`test_basic_module` should be visible in the scan directory:\n\n```bash\nlogoscore list-modules\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore load-module test_basic_module", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 4.5 Load the module\n\nLoad `test_basic_module` into the running daemon:\n\n```bash\nlogoscore load-module test_basic_module\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore status", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 4.6 Confirm the module is loaded\n\nRe-run `status`; the module that was `not_loaded` before now reports\n`loaded`:\n\n```bash\nlogoscore status\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore module-info test_basic_module", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 4.7 Introspect the module with module-info\n\n`module-info` lists the methods and events the module exposes \u2014 the\nsame methods you can `call`:\n\n```bash\nlogoscore module-info test_basic_module\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call test_basic_module echo hello", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 4.8 Call a method\n\n`echo` returns its argument unchanged \u2014 a string round-trip out to the\nmodule subprocess and back over liblogos' IPC:\n\n```bash\nlogoscore call test_basic_module echo hello\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call test_basic_module addInts 40 2", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 4.9 Call a second method\n\n`addInts` adds its two arguments. This exercises an `int` round-trip,\nwhere `echo` exercised a string:\n\n```bash\nlogoscore call test_basic_module addInts 40 2\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore stop", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 4.10 Stop the daemon\n\nShut the daemon down cleanly:\n\n```bash\nlogoscore stop\n```\n\nThe daemon removes its state file and exits."}, {"execs": [{"cmd": "sleep 2", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 2\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore status || true", "exit_code": 0, "kind": "run", "note": "expected '\"status\":\"not_running\"' not found in output", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logoscore: No such file or directory\n", "status": "fail"}], "md": "### 4.11 Confirm the daemon has stopped\n\nWith no daemon running, the client reports `not_running` and exits\nnon-zero, so we add `|| true` to let the doc-test assert on the output:\n\n```bash\nlogoscore status\n```"}]}, {"meta": {"name": "Embedding This liblogos as a Library", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Embedding This liblogos as a Library\n\n# WARNING\n  ** IMPORTANT **\n  This doctest is for internal dev purposes and should not be used. It displays important flaws that will be corrected, specifically that QCoreApplication should no longer be needed but it's pending some changes still at which point this doctest will be updated to reflect that\n  ** IMPORTANT **\n`logos-liblogos` is a **library**. The headless `logoscore` CLI and the\nbasecamp desktop app are just frontends for it \u2014 each one links\n`liblogos_core` and drives its C API (`logos_core.h`) to discover, load, and\nmanage modules. This doc-test shows how to do the same thing in **your own\nprogram**, built against **this** liblogos commit:\n\n1. Build `liblogos_core` (the C-API shared library), its `logos_host`\n   subprocess binary, and the `logos_core.h` header \u2014 all from the commit\n   under test.\n2. Build the `lgpm` package manager and install two real modules\n   ([`capability_module`](https://github.com/logos-co/logos-capability-module)\n   and [`test_basic_module`](https://github.com/logos-co/logos-test-modules))\n   into a local modules directory.\n3. Write a ~50-line C++ program that links `liblogos_core`, then calls the C\n   API to start the runtime and load `test_basic_module`.\n4. Build that program against this liblogos and run it \u2014 watching the module\n   come up over liblogos' own IPC.\n\nBecause the library, the host binary, and the headers all come from the commit\nunder test, a green run is direct evidence that **this** liblogos is usable as\nan embeddable library, not just through the `logoscore` frontend.\n\n> **Why C++ and not pure C?** The API in `logos_core.h` is plain C, but the\n> runtime is built on Qt internally (it uses `QPluginLoader` to read module\n> metadata and Qt's IPC stack to talk to modules). So an embedding program must\n> construct a `QCoreApplication` before it calls `logos_core_start()` \u2014 exactly\n> as `logoscore` and basecamp do. You do **not** need to run Qt's event loop;\n> the load calls are synchronous.\n\n**What you'll build:** A standalone C++ program that links `liblogos_core` from this commit and loads a real module \u2014 `test_basic_module` \u2014 through the C API.\n\n**What you'll learn:**\n\n- How to build `liblogos_core`, `logos_host`, and `logos_core.h` from a specific liblogos commit\n- What a minimal `CMakeLists.txt` that links `liblogos_core` looks like\n- The lifecycle of the C API: `logos_core_init` \u2192 `add_modules_dir` \u2192 `start` \u2192 `load_module` \u2192 `cleanup`\n- Why an embedding program needs a `QCoreApplication`, and where `logos_host` fits in (`LOGOS_HOST_PATH`)\n- How to install modules with `lgpm` so the runtime can discover them\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **A Linux or macOS machine.** The program runs headless via `QT_QPA_PLATFORM=offscreen`, so no display is required."}, {"execs": [], "md": "## How embedding liblogos works\n\nYour program links `liblogos_core` and calls its C API. The runtime loads\neach module in an isolated subprocess that it launches through a separate\n`logos_host` binary, and talks to it over the Logos IPC bridge:\n\nEverything below comes from the liblogos commit under test: the\n`liblogos_core` you link, the `logos_host` that hosts the module, and the\n`logos_core.h` header you compile against."}, {"execs": [], "md": "## Step 1: Build liblogos from this commit\n\nBuild the combined `logos-liblogos` package and symlink it to `./liblogos`.\nThe result contains everything an embedder needs: the C-API library, the\nheader, and the `logos_host` binary.\n\n> The URL carries a release placeholder that pins the build to a specific\n> commit: the doc-test runner expands it to a concrete ref. Locally that is\n> this checkout's `HEAD` (see `run.sh`); in CI it is the commit being\n> tested. With no pin it falls back to the latest `master`."}, {"execs": [{"cmd": "nix build 'github:logos-co/logos-liblogos/754d6f87b7e3815862e650886c0e7573632fc1b4' -o ./liblogos", "exit_code": 0, "kind": "run", "note": "", "output": "these 3 derivations will be built:\n  /nix/store/a236a46dqbx2g2376zwjyfxchv48c1ya-logos-liblogos-lib-0.1.0.drv\n  /nix/store/gavk6cb50vcdnvps9hbwq04aqd8s6lm2-logos-liblogos-bin-0.1.0.drv\n  /nix/store/xkslsh5j50kxbxjaamfsayqalyfk7n0d-logos-liblogos.drv\nthese 3 paths will be fetched (1.7 MiB download, 5.2 MiB unpacked):\n  /nix/store/xhra6bpgk7l0v4phiakj89nw1y7d5h3m-lgx-lib-0.1.0\n  /nix/store/ffxzxid7bfn51m33g7i5hvf2rfzrs2f5-logos-liblogos-build-0.1.0\n  /nix/store/64rdq0wb4v3091ivz2xljfwkvbyqdk5s-logos-package-manager-lib-1.0.0-dev\ncopying path '/nix/store/xhra6bpgk7l0v4phiakj89nw1y7d5h3m-lgx-lib-0.1.0' from 'https://logos-co.cachix.org'...\ncopying path '/nix/store/64rdq0wb4v3091ivz2xljfwkvbyqdk5s-logos-package-manager-lib-1.0.0-dev' from 'https://logos-co.cachix.org'...\ncopying path '/nix/store/ffxzxid7bfn51m33g7i5hvf2rfzrs2f5-logos-liblogos-build-0.1.0' from 'https://logos-co.cachix.org'...\nbuilding '/nix/store/a236a46dqbx2g2376zwjyfxchv48c1ya-logos-liblogos-lib-0.1.0.drv'...\nbuilding '/nix/store/gavk6cb50vcdnvps9hbwq04aqd8s6lm2-logos-liblogos-bin-0.1.0.drv'...\nbuilding '/nix/store/xkslsh5j50kxbxjaamfsayqalyfk7n0d-logos-liblogos.drv'...\n", "status": "pass"}], "md": "### 1.1 Build the library\n\n```bash\nnix build 'github:logos-co/logos-liblogos/754d6f87b7e3815862e650886c0e7573632fc1b4' -o ./liblogos\n```\n\nThe result has three things your program depends on:\n\n- `liblogos/include/logos_core.h` \u2014 the C API you compile against\n- `liblogos/lib/liblogos_core.so` \u2014 the shared library you link\n- `liblogos/bin/logos_host` \u2014 the subprocess host the runtime launches\n  to run each module"}, {"execs": [{"cmd": "ls liblogos/include/logos_core.h liblogos/lib/liblogos_core.so liblogos/bin/logos_host", "exit_code": 0, "kind": "run", "note": "", "output": "liblogos/bin/logos_host\nliblogos/include/logos_core.h\nliblogos/lib/liblogos_core.so\n", "status": "pass"}], "md": "### 1.2 Confirm the library, header, and host binary are present\n\n```bash\nls liblogos/include/logos_core.h liblogos/lib/liblogos_core.so liblogos/bin/logos_host\n```"}, {"execs": [], "md": "## Step 2: Build lgpm and the modules to load\n\nThe runtime discovers modules from a directory of installed packages. We\nbuild the `lgpm` package manager and two real modules' `.lgx` packages,\nthen install them in the next step. `test_basic_module` is loaded through\nthe host's capability layer, so we install `capability_module` alongside it."}, {"execs": [{"cmd": "nix build 'github:logos-co/logos-package-manager#cli' -o lgpm", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 2.1 Build lgpm\n\n```bash\nnix build 'github:logos-co/logos-package-manager#cli' -o lgpm\n```\n\nThe executable is at `./lgpm/bin/lgpm`."}, {"execs": [{"cmd": "nix build 'github:logos-co/logos-capability-module#lgx' -o cap-lgx", "exit_code": 0, "kind": "run", "note": "", "output": "unpacking 'github:logos-co/logos-capability-module/76872192bc4cea1690f3262e71f315740e93502a' into the Git cache...\nunpacking 'github:logos-co/logos-module-builder/9592569e6d28c5a805d5f34ecf11a0851d71030e?narHash=sha256-BCOA/Uxi0VOrH/GB%2B5Z7%2B6JhPXSg3RMrlwALrLG4ivw%3D' into the Git cache...\nunpacking 'github:logos-co/logos-cpp-sdk/8d19af0709fd87c208ba811950a00e2928a8716a?narHash=sha256-68REIomik94/2reVnhzswxPdilNKHXuskfVusbhCvYo%3D' into the Git cache...\nunpacking 'github:logos-co/logos-design-system/ee6258c1f05836761fd37d462aa36ec565dbe629?narHash=sha256-Q%2BGgYo7NEjebuZcliu/featUPkf%2BGa9EUr2OdYBYjPI%3D' into the Git cache...\nthis path will be fetched (925.6 KiB download, 925.6 KiB unpacked):\n  /nix/store/1qpyvp6grniq19maszcmyaxxvf30ysdd-logos-capability_module-module-lib-lgx-1.0.0\ncopying path '/nix/store/1qpyvp6grniq19maszcmyaxxvf30ysdd-logos-capability_module-module-lib-lgx-1.0.0' from 'https://logos-co.cachix.org'...\n", "status": "pass"}, {"cmd": "ls cap-lgx/*.lgx", "exit_code": 0, "kind": "run", "note": "", "output": "cap-lgx/logos-capability_module-module-lib.lgx\n", "status": "pass"}], "md": "### 2.2 Build the capability module's .lgx\n\n```bash\nnix build 'github:logos-co/logos-capability-module#lgx' -o cap-lgx\n```\n\nThe `.lgx` package is under `./cap-lgx/`:\n\n```bash\nls cap-lgx/*.lgx\n```"}, {"execs": [{"cmd": "SYSTEM=$(nix eval --impure --raw --expr 'builtins.currentSystem')\nnix build \"github:logos-co/logos-test-modules#modules.$SYSTEM.test_basic_module.lgx\" -o module-lgx\n", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}, {"cmd": "ls module-lgx/*.lgx", "exit_code": 0, "kind": "run", "note": "", "output": "module-lgx/logos-test_basic_module-module-lib.lgx\n", "status": "pass"}], "md": "### 2.3 Build the test module's .lgx\n\n`logos-test-modules` publishes each of its modules under\n`modules.<system>.<name>`, so the attribute path carries the Nix system\ndouble \u2014 `builtins.currentSystem` supplies it.\n\n```bash\nSYSTEM=$(nix eval --impure --raw --expr 'builtins.currentSystem')\nnix build \"github:logos-co/logos-test-modules#modules.$SYSTEM.test_basic_module.lgx\" -o module-lgx\n\n```\n\nThe `.lgx` package is under `./module-lgx/`:\n\n```bash\nls module-lgx/*.lgx\n```"}, {"execs": [], "md": "## Step 3: Install the modules with lgpm\n\nInstall both packages into a local `./modules` directory. Installing through\n`lgpm` writes each module's `manifest.json` with `\"type\": \"core\"`, which is\nwhat makes the runtime discover them at startup. Both are unsigned local dev\nbuilds, so we pass `--allow-unsigned`."}, {"execs": [{"cmd": "./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file cap-lgx/*.lgx", "exit_code": 0, "kind": "run", "note": "", "output": "Installing from file: cap-lgx/logos-capability_module-module-lib.lgx... done\nInstalled to: ./modules\n", "status": "pass"}], "md": "### 3.1 Install capability_module\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file cap-lgx/*.lgx\n```"}, {"execs": [{"cmd": "./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file module-lgx/*.lgx", "exit_code": 0, "kind": "run", "note": "", "output": "Installing from file: module-lgx/logos-test_basic_module-module-lib.lgx... done\nInstalled to: ./modules\n", "status": "pass"}], "md": "### 3.2 Install test_basic_module\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file module-lgx/*.lgx\n```"}, {"execs": [{"cmd": "./lgpm/bin/lgpm --modules-dir ./modules list", "exit_code": 0, "kind": "run", "note": "", "output": "Found 2 installed module(s):\n\nNAME                           VERSION         TYPE       CATEGORY       \n----------------------------------------------------------------------\ncapability_module              1.0.0           core       security       \ntest_basic_module              1.0.0           core       testing        \n", "status": "pass"}], "md": "### 3.3 Confirm both modules are installed\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules list\n```\n\nBoth modules now report type `core`, so `logos_core_start()` will\ndiscover them."}, {"execs": [], "md": "## Step 4: Write the embedding program\n\nNow the program itself. It is plain C++ that links `liblogos_core` and\ndrives the C API. Two files: the source and a `CMakeLists.txt`."}, {"execs": [{"cmd": "write embed-app/src/main.cpp", "kind": "file", "note": "Wrote embed-app/src/main.cpp", "status": "pass"}], "md": "### 4.1 src/main.cpp\n\nThe whole lifecycle in one `main()`:\n\n- Construct a `QCoreApplication` (liblogos uses Qt internally), but\n  never call `app.exec()` \u2014 the load calls are synchronous.\n- Resolve the modules directory to an absolute path (`logos_core`\n  cannot read plugin metadata from a relative path).\n- `logos_core_init` \u2192 `logos_core_add_modules_dir` \u2192 `logos_core_start`\n  (this discovers modules and brings up `capability_module`).\n- `logos_core_load_module(name, true)` loads the requested module and\n  its dependencies; the module list accessors confirm what is up.\n\n```cpp\n// Embedding the Logos runtime (liblogos_core) in your own program.\n//\n// liblogos exposes a C API in <logos_core.h>. Internally the runtime\n// is built on Qt (it uses QPluginLoader to read module metadata and\n// Qt's IPC stack to talk to modules), so an application that embeds\n// it must construct a QCoreApplication before driving the C API. You\n// do NOT need to run Qt's event loop: the load API below is\n// synchronous. Module subprocesses are launched through a separate\n// `logos_host` binary, located via the LOGOS_HOST_PATH environment\n// variable.\n#include <QCoreApplication>\n#include \"logos_core.h\"\n\n#include <cstdio>\n#include <filesystem>\n\nstatic void printList(const char* label, char** items) {\n    printf(\"%s:\", label);\n    if (!items || !items[0]) { printf(\" (none)\\n\"); return; }\n    printf(\"\\n\");\n    for (int i = 0; items[i]; ++i)\n        printf(\"  - %s\\n\", items[i]);\n}\n\nint main(int argc, char** argv) {\n    setvbuf(stdout, nullptr, _IONBF, 0);\n\n    const char* modulesArg = (argc > 1) ? argv[1] : \"./modules\";\n    const char* moduleName = (argc > 2) ? argv[2] : \"test_basic_module\";\n\n    // logos_core needs an absolute modules directory: it cannot read\n    // plugin metadata from a relative path. Resolve it up front.\n    const std::string modulesDir =\n        std::filesystem::absolute(modulesArg).string();\n\n    // liblogos uses Qt internally, so a QCoreApplication must exist\n    // before we start the runtime. We never call app.exec(): the\n    // calls below are synchronous.\n    QCoreApplication app(argc, argv);\n\n    printf(\"Initializing Logos runtime...\\n\");\n    logos_core_init(argc, argv);\n    logos_core_add_modules_dir(modulesDir.c_str());\n\n    printf(\"Starting (modules dir: %s)\\n\", modulesDir.c_str());\n    logos_core_start();\n    printList(\"Discovered modules\", logos_core_get_known_modules());\n\n    printf(\"Loading '%s' (with dependencies)...\\n\", moduleName);\n    int ok = logos_core_load_module(moduleName, /*with_dependencies=*/true);\n    printf(\"Load %s\\n\", ok ? \"OK\" : \"FAILED\");\n    printList(\"Loaded modules\", logos_core_get_loaded_modules());\n\n    logos_core_cleanup();\n    return ok ? 0 : 1;\n}\n```"}, {"execs": [{"cmd": "write embed-app/CMakeLists.txt", "kind": "file", "note": "Wrote embed-app/CMakeLists.txt", "status": "pass"}], "md": "### 4.2 CMakeLists.txt\n\nA minimal build: find Qt6 Core, find `liblogos_core` under\n`LOGOS_LIBLOGOS_ROOT` (the `nix build` result), and link both. The\n`BUILD_RPATH` lets the program find `liblogos_core.so` at runtime\nwithout setting `LD_LIBRARY_PATH`.\n\n```cmake\ncmake_minimum_required(VERSION 3.16)\nproject(logos_embed_app LANGUAGES CXX)\n\nset(CMAKE_CXX_STANDARD 17)\nset(CMAKE_CXX_STANDARD_REQUIRED ON)\n\n# liblogos is built on Qt; an embedding program needs Qt Core too.\nfind_package(Qt6 REQUIRED COMPONENTS Core)\n\n# Point this at the `nix build` result of logos-liblogos\n# (it has bin/, lib/, and include/). Defaults to ../liblogos.\nif(NOT DEFINED LOGOS_LIBLOGOS_ROOT)\n    set(LOGOS_LIBLOGOS_ROOT \"${CMAKE_SOURCE_DIR}/../liblogos\")\nendif()\nget_filename_component(LOGOS_LIBLOGOS_ROOT \"${LOGOS_LIBLOGOS_ROOT}\" ABSOLUTE)\n\nfind_library(LOGOS_CORE_LIBRARY NAMES logos_core\n    PATHS \"${LOGOS_LIBLOGOS_ROOT}/lib\" NO_DEFAULT_PATH REQUIRED)\n\nadd_executable(logos_embed_app src/main.cpp)\ntarget_include_directories(logos_embed_app PRIVATE\n    \"${LOGOS_LIBLOGOS_ROOT}/include\")\ntarget_link_libraries(logos_embed_app PRIVATE\n    ${LOGOS_CORE_LIBRARY} Qt6::Core)\n\n# Find liblogos_core.{so,dylib} at runtime without LD_LIBRARY_PATH.\nset_target_properties(logos_embed_app PROPERTIES\n    BUILD_RPATH \"${LOGOS_LIBLOGOS_ROOT}/lib\")\n```"}, {"execs": [], "md": "## Step 5: Build the program against this liblogos\n\nBuild the program with CMake. We run the build **inside this liblogos'\ndev shell** (`nix develop`) so the compiler and Qt version exactly match\nthe library you are linking \u2014 mismatched Qt is the most common cause of\nembedding failures."}, {"execs": [{"cmd": "nix develop 'github:logos-co/logos-liblogos/754d6f87b7e3815862e650886c0e7573632fc1b4' -c bash -c 'cd embed-app && cmake -S . -B build -G Ninja -DLOGOS_LIBLOGOS_ROOT=$PWD/../liblogos && cmake --build build'", "exit_code": 1, "kind": "run", "note": "exit code 1", "output": "copying path '/nix/store/fxrdd2q93a3mkv36snkdb72n0613kqvp-nix-shell-env' from 'https://logos-co.cachix.org'...\nthese 2 paths will be fetched (1.2 MiB download, 7.1 MiB unpacked):\n  /nix/store/ddx7976jyll30xjbasghv9jailswprcp-bash-interactive-5.3p3\n  /nix/store/w6pbdiqjryl4ygfx5k4ijjcr5f6imv6i-bash-interactive-5.3p3-man\ncopying path '/nix/store/w6pbdiqjryl4ygfx5k4ijjcr5f6imv6i-bash-interactive-5.3p3-man' from 'https://cache.nixos.org'...\ncopying path '/nix/store/ddx7976jyll30xjbasghv9jailswprcp-bash-interactive-5.3p3' from 'https://cache.nixos.org'...\n-- The CXX compiler identification is GNU 14.3.0\n-- Detecting CXX compiler ABI info\n-- Detecting CXX compiler ABI info - done\n-- Check for working CXX compiler: /nix/store/95k9rsn1zsw1yvir8mj824ldhf90i4qw-gcc-wrapper-14.3.0/bin/g++ - skipped\n-- Detecting CXX compile features\n-- Detecting CXX compile features - done\n-- Performing Test CMAKE_HAVE_LIBC_PTHREAD\n-- Performing Test CMAKE_HAVE_LIBC_PTHREAD - Success\n-- Found Threads: TRUE\n-- Performing Test HAVE_STDATOMIC\n-- Performing Test HAVE_STDATOMIC - Success\n-- Found WrapAtomic: TRUE\n-- Configuring done (1.0s)\n-- Generating done (0.0s)\n-- Build files have been written to: /tmp/doctest-test-_jgccfl5/embed-app/build\n[1/2] Building CXX object CMakeFiles/logos_embed_app.dir/src/main.cpp.o\nFAILED: [code=1] CMakeFiles/logos_embed_app.dir/src/main.cpp.o \n/nix/store/95k9rsn1zsw1yvir8mj824ldhf90i4qw-gcc-wrapper-14.3.0/bin/g++ -DQT_CORE_LIB -DQT_NO_DEBUG -I/tmp/doctest-test-_jgccfl5/liblogos/include -isystem /nix/store/dkfr32yi7p8cdxsnll05q1kax19fl7ay-qtbase-6.9.2/include/QtCore -isystem /nix/store/dkfr32yi7p8cdxsnll05q1kax19fl7ay-qtbase-6.9.2/mkspecs/ g path '/nix/store/5jf188n979ajjscpb47a5kh8s020xscp-logos-module-cli-0.1.0' from 'https://logos-co.cachix.org'...\n", "status": "pass"}], "md": "### 7.1 Build lm\n\n```bash\nnix build 'github:logos-co/logos-module#lm' -o lm\n```"}, {"execs": [{"cmd": "./lm/bin/lm methods ./modules/test_basic_module/test_basic_module_plugin.so", "exit_code": 0, "kind": "run", "note": "", "output": "Plugin Methods:\n===============\n\nvoid doNothing()\n  Signature: doNothing()\n  Invokable: yes\n\nvoid doNothingWithArgs(tstr a, int b)\n  Signature: doNothingWithArgs(tstr,int)\n  Invokable: yes\n\nbool returnTrue()\n  Signature: returnTrue()\n  Invokable: yes\n\nbool returnFalse()\n  Signature: returnFalse()\n  Invokable: yes\n\nbool isPositive(int value)\n  Signature: isPositive(int)\n  Invokable: yes\n\nint returnInt()\n  Signature: returnInt()\n  Invokable: yes\n\nint addInts(int a, int b)\n  Signature: addInts(int,int)\n  Invokable: yes\n\nint stringLength(tstr s)\n  Signature: stringLength(tstr)\n  Invokable: yes\n\ntstr returnString()\n  Signature: returnString()\n  Invokable: yes\n\ntstr echo(tstr input)\n  Signature: echo(tstr)\n  Invokable: yes\n\ntstr concat(tstr a, tstr b)\n  Signature: concat(tstr,tstr)\n  Invokable: yes\n\nresult successResult()\n  Signature: successResult()\n  Invokable: yes\n\nresult errorResult()\n  Signature: errorResult()\n  Invokable: yes\n\nresult resultWithMap()\n  Signature: resultWithMap()\n  Invokable: yes\n\nresult resultWithList()\n  Signature: resultWithList()\n  Invokable: yes\n\nresult validateInput(tstr input)\n  Signature: validateInput(tstr)\n  Invokable: yes\n\nany returnVariantInt()\n  Signature: returnVariantInt()\n  Invokable: yes\n\nany returnVariantString()\n  Signature: returnVariantString()\n  Invokable: yes\n\nany returnVariantMap()\n  Signature: returnVariantMap()\n  Invokable: yes\n\nany returnVariantList()\n  Signature: returnVariantList()\n  Invokable: yes\n\n[any] returnJsonArray()\n  Signature: returnJsonArray()\n  Invokable: yes\n\n[any] makeJsonArray(tstr a, tstr b)\n  Signature: makeJsonArray(tstr,tstr)\n  Invokable: yes\n\n[tstr] returnStringList()\n  Signature: returnStringList()\n  Invokable: yes\n\n[tstr] splitString(tstr input)\n  Signature: splitString(tstr)\n  Invokable: yes\n\nint echoInt(int n)\n  Signature: echoInt(int)\n  Invokable: yes\n\nbool echoBool(bool b)\n  Signature: echoBool(bool)\n  Invokable: yes\n\ntstr joinStrings([tstr] list)\n  Signature: joinStrings([tstr])\n  Invokable: yes\n\nint byteArraySize(bstr data)\n  Signature: byteArraySize(bstr)\n  Invokable: yes\n\ntstr urlToString(tstr url)\n  Signature: urlToString(tstr)\n  Invokable: yes\n\ntstr noArgs()\n  Signature: noArgs()\n  Invokable: yes\n\ntstr oneArg(tstr a)\n  Signature: oneArg(tstr)\n  Invokable: yes\n\ntstr twoArgs(tstr a, int b)\n  Signature: twoArgs(tstr,int)\n  Invokable: yes\n\ntstr threeArgs(tstr a, int b, bool c)\n  Signature: threeArgs(tstr,int,bool)\n  Invokable: yes\n\ntstr fourArgs(tstr a, int b, bool c, tstr d)\n  Signature: fourArgs(tstr,int,bool,tstr)\n  Invokable: yes\n\ntstr fiveArgs(tstr a, int b, bool c, tstr d, int e)\n  Signature: fiveArgs(tstr,int,bool,tstr,int)\n  Invokable: yes\n\nvoid emitTestEvent(tstr data)\n  Signature: emitTestEvent(tstr)\n  Invokable: yes\n\nvoid emitMultiArgEvent(tstr name, int count)\n  Signature: emitMultiArgEvent(tstr,int)\n  Invokable: yes\n\ntstr echoWithDelay(tstr value, int delayMs)\n  Signature: echoWithDelay(tstr,int)\n  Invokable: yes\n\nvoid crashOnDemand()\n  Signature: crashOnDemand()\n  Invokable: yes\n\ntstr name()\n  Signature: name()\n  Invokable: yes\n  Description: The module's name, as declared in its metadata.\n\ntstr version()\n  Signature: version()\n  Invokable: yes\n  Description: The module's version, as declared in its metadata.\n\n", "status": "pass"}], "md": "### 7.2 List the module's invokable methods\n\n```bash\nlm methods ./modules/test_basic_module/test_basic_module_plugin.so\n```\n\nThese are the `Q_INVOKABLE` methods the module you just loaded exposes \u2014\nthe entry points a frontend would call over the IPC bridge once the\nmodule is up."}]}, {"meta": {"name": "Asking the Host Whether a Module Actually Loaded", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Asking the Host Whether a Module Actually Loaded\n\n`logos_core_load_module` used to answer \"loaded\" as soon as the OS had made a\nprocess. Spawning a host and loading the plugin inside it are two different\nfacts, and collapsing them is how a module whose plugin never loaded got\nreported as loaded, with the real failure surfacing hops away in a consumer.\n\nThe fix gave the host a line to say which: it prints\n`@logos-load-status ok`, or `@logos-load-status failed <reason>`, and the\ndaemon waits for it. This doc-test exercises that line directly \u2014 no daemon,\nno frontend, just the host binary this repository builds and a real plugin it\nships \u2014 so it runs unchanged on Linux, macOS **and Windows**.\n\n**What you'll build:** A module host, handed a real plugin, reporting its own verdict.\n\n**What you'll learn:**\n\n- What `logos_host_qt` prints once a plugin has loaded, and where\n- How the host takes its auth token on stdin rather than from a socket\n- That the same check runs on Windows, where the plugin is a `.dll`\n\n## Prerequisites\n\n- **Nix** with flakes enabled \u2014 needed only to build the host. The run half\nneeds nothing but the built tree, which is why it also runs on a Windows\nmachine that has no nix at all."}, {"execs": [], "md": "## Step 1: Build the module host\n\n`logos-liblogos-bin` is the runtime half of this repository: the\n`logos_host` / `logos_host_qt` binaries, and the modules bundled beside\nthem. Naming the output link after the attribute matters \u2014 a Windows run\nfinds the same tree already staged under that name, so every path below\nis written once."}, {"execs": [{"cmd": "nix build \"github:logos-co/logos-liblogos/754d6f87b7e3815862e650886c0e7573632fc1b4#logos-liblogos-bin\" -o logos-liblogos-bin", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 1.1 Build it\n\n```bash\nnix build 'github:logos-co/logos-liblogos#logos-liblogos-bin'\n```"}, {"execs": [], "md": "## Step 2: Confirm the host has a plugin to load\n\nThe bundled modules are real installed packages, not loose libraries: a\n`manifest.json`, a `variant` marker, and the plugin binary. `modules_state`\nis the one used below \u2014 it is small, it has no dependencies of its own, and\nit publishes a normal module object, so a successful load is a full load\nrather than a special case."}, {"execs": [{"cmd": "ls logos-liblogos-bin/modules/modules_state", "exit_code": 0, "kind": "run", "note": "", "output": "manifest.json\nmodules_state_plugin.so\n", "status": "pass"}], "md": "### 2.1 List what ships beside the host\n\n```bash\nls logos-liblogos-bin/modules/modules_state\n```"}, {"execs": [], "md": "## Step 3: The host reports its own verdict\n\nRun the host directly, the way the daemon runs it: name the module, point\nat the plugin, and hand the auth token over stdin. The host stays alive\nonce it is up \u2014 a module host is a server \u2014 so this reads its log until\nthe status line appears and then stops it, rather than waiting for an exit\nthat is not coming.\n\n`@logos-load-status ok` is the whole assertion. It means the plugin was\nloaded inside the host process, which is the fact the daemon now waits for\nbefore it tells anyone a module is loaded."}, {"execs": [{"cmd": "printf '00000000-0000-0000-0000-000000000000\\n' > token.txt\n# Relative is fine: the host resolves --path against the working\n# directory. It did not always -- a relative path used to come back as\n# \"the shared library was not found\", which reads as a missing\n# dependency of a plugin that was found rather than as a path nobody\n# resolved. cygpath stays, for its own separate reason: git-bash hands\n# a POSIX path to a NATIVE exe, and cygpath -- present there and\n# nowhere else -- is what puts it in Windows form.\nplugin=\"logos-liblogos-bin/modules/modules_state/modules_state_plugin.so\"\nif command -v cygpath >/dev/null 2>&1; then plugin=$(cygpath -w \"$plugin\"); fi\n./logos-liblogos-bin/bin/logos_host_qt \\\n  --name modules_state \\\n  --path \"$plugin\" \\\n  --token-source stdin < token.txt > host.log 2>&1 &\nhost=$!\n# `if`, not `grep -q ... && break`: under `set -e` a failing grep in an\n# && list takes the whole script down on the first iteration, before\n# the host has had time to say anything.\nfor _ in $(seq 1 60); do\n  if grep -q '@logos-load-status' host.log 2>/dev/null; then break; fi\n  sleep 1\ndone\nkill \"$host\" 2>/dev/null || true\ncat host.log\n", "exit_code": 0, "kind": "run", "note": "", "output": "Debug: [LogosProviderObject] LogosAPIProvider: detected LogosProviderPlugin for \"modules_state\"\nDebug: [LogosProviderObject] LogosAPIProvider: registering LogosProviderObject directly for \"modules_state\"\nDebug: [LogosProviderObject] ModuleProxy: created, wrapping LogosProviderObject \"modules_state\"\nDebug: RemoteTransportHost: Created registry host with URL: \"local:logos_modules_state_f5b0eb959dbb\"\nDebug: RemoteTransportHost: Published object: \"modules_state__handshake\"\nDebug: [LogosProviderObject] LogosAPIProvider: published handshake surface \"modules_state__handshake\" - token delivery is reachable while \"modules_state\" initializes\nDebug: [LogosProviderObject] LogosProviderBase::init called\nDebug: RemoteTransportHost: Published object: \"modules_state\"\nDebug: [LogosProviderObject] LogosAPIProvider: successfully published \"modules_state\"\n\n@logos-load-status ok\nDebug: ModuleProxy: destroyed\n", "status": "pass"}], "md": "### 3.1 Hand it a real plugin and read the verdict\n\n```bash\nprintf '<token>\\n' > token.txt\n./logos-liblogos-bin/bin/logos_host_qt \\\n  --name modules_state \\\n  --path logos-liblogos-bin/modules/modules_state/modules_state_plugin.dylib \\\n  --token-source stdin < token.txt\n```\n\nA plugin that fails to load answers on the same line \u2014\n`@logos-load-status failed <reason>` \u2014 and that reason is what the\ndaemon reports to its caller and onto the `modules_state` feed, instead\nof the success it used to invent."}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
